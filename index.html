  #qdr-btn {
    position: fixed; bottom: 24px; right: 24px;
    width: 60px; height: 60px; border-radius: 50%;
    background: #fff; border: 2px solid #8B5CF6; cursor: pointer;
    z-index: 9999; box-shadow: 0 4px 16px rgba(139,92,246,.35);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; transition: transform .2s, box-shadow .2s;
  }
  #qdr-btn:hover { transform: scale(1.07); box-shadow: 0 6px 24px rgba(139,92,246,.5); }
  #qdr-btn img { width: 54px; height: 54px; object-fit: contain; border-radius: 50%; }

  #qdr-window {
    display: none; position: fixed; bottom: 96px; right: 24px;
    width: 380px; max-height: 620px; background: #fff;
    border-radius: 16px; box-shadow: 0 8px 40px rgba(139,92,246,.18);
    z-index: 9998; flex-direction: column; overflow: hidden;
    font-family: 'Poppins', 'Inter', sans-serif;
  }
  #qdr-window.open { display: flex; }

  /* Header */
  #qdr-header {
    background: #8B5CF6; color: #fff; padding: 14px 16px;
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  #qdr-header .avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #fff; }
  #qdr-header .avatar img { width: 36px; height: 36px; object-fit: contain; border-radius: 50%; }
  #qdr-header .info { flex: 1; }
  #qdr-header .name { font-size: 14px; font-weight: 600; }
  #qdr-header .status { font-size: 11px; opacity: .75; }
  #qdr-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; opacity: .8; }
  #qdr-close:hover { opacity: 1; }

  /* Mensajes */
  #qdr-messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px; background: #f9f7fe;
  }
  .qdr-msg { max-width: 84%; padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.55; word-break: break-word; }
  .qdr-msg.bot {
    background: #fff; border: 1px solid #e8e0fa; border-bottom-left-radius: 4px;
    align-self: flex-start; display: flex; gap: 8px; align-items: flex-start; max-width: 92%;
  }
  .qdr-msg.bot .bot-av { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #fff; }
  .qdr-msg.bot .bot-av img { width: 24px; height: 24px; object-fit: contain; }
  .qdr-msg.bot .bot-text { flex: 1; }
  .qdr-msg.bot .bot-text strong { font-weight: 600; }
  .qdr-msg.bot .bot-text em { font-style: italic; }
  .qdr-msg.bot .bot-text ul { margin: 6px 0 2px 16px; padding: 0; }
  .qdr-msg.bot .bot-text li { margin-bottom: 3px; }
  .qdr-msg.bot .bot-text table { border-collapse: collapse; font-size: 12px; width: 100%; margin: 8px 0; }
  .qdr-msg.bot .bot-text th { background: #8B5CF6; color: #fff; padding: 4px 8px; text-align: left; }
  .qdr-msg.bot .bot-text td { border: 1px solid #e0d6f7; padding: 4px 8px; }
  .qdr-msg.bot .bot-text tr:nth-child(even) td { background: #f3effd; }
  .qdr-msg.user { background: #8B5CF6; color: #fff; border-bottom-right-radius: 4px; align-self: flex-end; }

  /* Typing */
  .qdr-typing {
    display: flex; gap: 5px; align-items: center; padding: 10px 14px;
    background: #fff; border: 1px solid #e8e0fa; border-radius: 14px;
    border-bottom-left-radius: 4px; align-self: flex-start;
  }
  .qdr-typing span { width: 7px; height: 7px; background: #8B5CF6; border-radius: 50%; animation: qdrb .9s infinite; opacity: .5; }
  .qdr-typing span:nth-child(2) { animation-delay: .15s; }
  .qdr-typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes qdrb { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

  /* Botón lead */
  #qdr-lead-btn {
    display: none; margin: 0 16px 8px; background: #8B5CF6; color: #fff;
    border: none; border-radius: 8px; padding: 10px 14px; font-size: 13px;
    font-weight: 600; cursor: pointer; text-align: center; transition: background .2s;
    font-family: inherit; flex-shrink: 0;
  }
  #qdr-lead-btn:hover { background: #7C3AED; }

  /* Input area */
  #qdr-input-area {
    display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #f0e8ff;
    align-items: center; background: #fff; flex-shrink: 0;
  }
  #qdr-input {
    flex: 1; border: 1px solid #e0d6f7; border-radius: 20px; padding: 8px 14px;
    font-size: 13.5px; outline: none; resize: none; font-family: inherit;
    max-height: 90px; overflow-y: auto; line-height: 1.5;
  }
  #qdr-input:focus { border-color: #8B5CF6; }
  #qdr-send {
    width: 36px; height: 36px; border-radius: 50%; background: #8B5CF6;
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background .2s;
  }
  #qdr-send:hover { background: #7C3AED; }
  #qdr-send svg { width: 16px; height: 16px; fill: #fff; }

  /* Footer */
  #qdr-footer {
    text-align: center; padding: 6px 0 8px; font-size: 10px; color: #aaa;
    background: #fff; flex-shrink: 0;
  }
  #qdr-footer a { color: #8B5CF6; text-decoration: none; }

  /* ── Formulario de contacto ── */
  #qdr-form-wrap {
    display: none; flex-direction: column; flex: 1; min-height: 0;
    background: #fff; overflow: hidden;
  }
  #qdr-form-wrap.open { display: flex; }
  #qdr-form-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; overflow-y: auto; }

  #qdr-form-header {
    background: #8B5CF6; color: #fff; padding: 14px 16px;
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  #qdr-form-header .name { font-size: 14px; font-weight: 600; flex: 1; }
  #qdr-form-back { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; opacity: .8; }
  #qdr-form-back:hover { opacity: 1; }


  .qdr-field { display: flex; flex-direction: column; gap: 4px; }
  .qdr-field label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: #6b7280; }
  .qdr-field input, .qdr-field select, .qdr-field textarea {
    border: 1px solid #e0d6f7; border-radius: 8px; padding: 9px 12px;
    font-size: 13.5px; font-family: inherit; outline: none; color: #1f2937;
    width: 100%; box-sizing: border-box; background: #fff;
  }
  .qdr-field input:focus, .qdr-field select:focus, .qdr-field textarea:focus { border-color: #8B5CF6; }
  .qdr-field textarea { resize: vertical; min-height: 72px; }

  .qdr-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Teléfono con prefijo */
  .qdr-phone-row { display: flex; gap: 8px; }
  #qdr-phone-prefix { width: 130px; flex-shrink: 0; }

  #qdr-form-submit {
    background: #8B5CF6; color: #fff; border: none; border-radius: 8px;
    padding: 11px; font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: background .2s; margin: 0 16px 8px;
  }
  #qdr-form-submit:hover { background: #7C3AED; }

  /* Sección divisor */
  .qdr-section-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .8px; color: #8B5CF6; margin-top: 4px; margin-bottom: -4px;
  }

  /* Éxito */
  #qdr-form-success {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 24px; text-align: center; gap: 12px; flex: 1;
  }
  #qdr-form-success.show { display: flex; }
  #qdr-form-success .icon { font-size: 48px; }
  #qdr-form-success h3 { font-size: 17px; font-weight: 700; color: #1f2937; }
  #qdr-form-success p { font-size: 13px; color: #6b7280; }
  #qdr-form-success-back {
    background: #8B5CF6; color: #fff; border: none; border-radius: 8px;
    padding: 10px 24px; font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; margin-top: 8px;
  }

  @media (max-width: 440px) {
    #qdr-window { width: calc(100vw - 16px); right: 8px; bottom: 80px; max-height: 75vh; }
    #qdr-btn { bottom: 16px; right: 16px; }
  }
</style>

  // ── Parseo de Markdown ────────────────────────────────────
  function parseMd(t) {
    // Tablas
    const lines = t.split('\n');
    let out = '', inTable = false, headers = [];
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i].trim();
      if (l.startsWith('|') && l.endsWith('|')) {
        const isSep = /^\|[\s\-:|]+\|$/.test(l);
        if (isSep) continue;
        const cells = l.slice(1,-1).split('|').map(c => c.trim());
        if (!inTable) {
          inTable = true; headers = cells;
          out += '<table><thead><tr>' + cells.map(c=>`<th>${c}</th>`).join('') + '</tr></thead><tbody>';
        } else {
          out += '<tr>' + cells.map(c=>`<td>${c}</td>`).join('') + '</tr>';
        }
      } else {
        if (inTable) { out += '</tbody></table>'; inTable = false; headers = []; }
        out += l + '\n';
      }
    }
    if (inTable) out += '</tbody></table>';
    t = out;
    // Links, negritas, cursiva, bullets
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:#8B5CF6;text-decoration:underline;">$1</a>');
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');
    t = t.replace(/^[\*\-•] (.+)/gm, '<li>$1</li>');
    t = t.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
    t = t.replace(/<\/ul>\s*<ul>/g, '');
    t = t.replace(/\n{2,}/g, '<br><br>');
    t = t.replace(/\n/g, '<br>');
    return t;
  }

  async function streamBotResponse(text) {

      for (const w of words) {

      fullText += '\n\n';

      await sleep(60);

    saveMsgs();
    leadBtn.style.display = 'block';
    extractDataFromMessage(fullText);
    requestAnimationFrame(() => { messages.scrollTop = messages.scrollHeight; });
    return fullText;

  // ── Extracción de datos del chat ──────────────────────────
  function extractDataFromMessage(text) {
    // Artista mencionado
    const artistas = [
      'Vanessa Karin','Alberto Gayoso','Jose Antonio Torres','Marysol NJ',
      'Alejandra Bambarén','ABAMGU','Sandra Allende','Ignacio Alvaro',
      'Leonardo Beltrán','Sandra Rizo','David Rejas','Giancarlo Melgar',
      'Alfredo Grosman','FRH ARTE','Fiorella Reinoso','Entes Jiménez','Entes',
      'Laura Ferrand','Teo Baertl','Claudia Luque','Yulia Katkova',
      'Cecilia Maximiliano','Ian Deneumostier','Lucía Bringas','Ximena Giuria'
    ];
    for (const a of artistas) {
      if (text.includes(a)) { lastData.obra_artista = a; break; }
    }

    // Última obra mencionada en formato de lista: **Título** — USD
    const bulletMatches = [...text.matchAll(/\*\*([^*]+)\*\*\s*[—–-]\s*USD/g)];
    if (bulletMatches.length > 0) {
      lastData.obra_titulo = bulletMatches[bulletMatches.length - 1][1].trim();
    }

    // Obra mencionada entre comillas en prosa (ej: "La selva que ya no hay que temer")
    if (!lastData.obra_titulo) {
      const proseMatch = text.match(/"([^"]{5,80})"/);
      if (proseMatch) lastData.obra_titulo = proseMatch[1];
    }

    // URL de la última obra mencionada
    const urlMatches = [...text.matchAll(/\[Ver obra\]\((https?:\/\/[^\)]+)\)/g)];
    if (urlMatches.length > 0) {
      lastData.obra_url = urlMatches[urlMatches.length - 1][1];
    }

    // Precio mencionado
    var usdMatch = text.match(/USD\s*([\d,]+)/);
    if (usdMatch && !lastData.precio_referencia) lastData.precio_referencia = usdMatch[1];

    // Nombre del visitante
    var nombreMatch = text.match(/[Hh]ola,?\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)!/);
    if (nombreMatch && nombreMatch[1] !== 'Gracias') lastData.nombre = nombreMatch[1];

    sessionStorage.setItem('qdr_data', JSON.stringify(lastData));
  }

  // ── Detección de intento de contacto ─────────────────────
  function userWantsContact(text) {
    return /\b(contact[ae]n?me?|llámenme|escríbanme|mándenme|quiero que me contact|quiero hablar con|hablar con el equipo|comuníquense|ponerse en contacto|me pongan en contacto|quiero ser contactad)/i.test(text);
  }

  // ── Envío de mensaje ──────────────────────────────────────
  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    const wantsContact = userWantsContact(text);
    leadBtn.style.display = 'none';
    addUserMessage(text);
    showTyping();
    try {
      const res = await fetch(QDR_WEBHOOK, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ message: text, sessionId: QDR_SESSION })
      });
      const data = await res.json();
      hideTyping();
      const botReply = data.output || data.text || data.message || 'Lo siento, hubo un problema de conexión.';
      await streamBotResponse(botReply);
      if (wantsContact) {
        setTimeout(() => openLeadForm(), 1200);
      }
    } catch(e) {
      hideTyping();
      addBotMessage('Tuve un problema de conexión. Por favor, intenta de nuevo en un momento.');
    }
  }

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 90) + 'px';
  });

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

    'Cecilia Maximiliano': ['Sin nombre'],

    'FRH ARTE - Fiorella Reinoso Hudtwalcker': ['Diosas','100 años de soledad','Raíces','Matices','EL PODER DE LA ACTITUD','MUNDO MULTICOLOR','INSPIRACION MULTICOLOR','CONECTANDO COLORES','CAMINOS MULTICOLOR','Explosion de Colores','NATURALEZA VIVA','Luna Llena','Atardecer en la costa','Amanecer en la costa'],

    'Laura Ferrand': ['Hilos que unen (1)','Hilos que unen (2)','Hilos que unen (3)','Hilos que unen (4)','Hilos que unen (5)','Hilos que unen (6)'],

    'Teo Baertl Grau': ['Pintura Sexanxiofilica #6','Pintura Sexanxiofilica - Prueba #5','Pintura Sexanxiofilica - Prueba #4'],
    'Vanessa Karin': ['La oscuridad que empiezo a entender','La oscuridad que me arrastra','La cascada donde se ahogan nuestras lagrimas','Los ojitos que tanto ame','El rayo que nos premia','La luz que nos guia','La selva que ya no hay que temer','El cielo que descubrimos','Las cascadas que nos limpian','El viento que me abraza','Renacer','Beso a la libertad','La vida que no es mía','La sinfonía que compusimos juntos','Sueños de una noche de primavera','La cascada que nos une','Melodias que tocan nuestras almas','El primer paso','El beso del amanecer','La melodía de nuestros corazones','Las Notas del Silencio','La niña de las flores','Nuestro Propio Universo','El abrazo del cielo','El rio de los sueños','La danza de las luciérnagas','El jardin de las mariposas','sin titulo','mmm','Me gusta ver como te vienes','hu','De mi para ti'],

  };

  // Poblar obras según artista seleccionado
  const artistaSelect = $('qdr-artista');
  const obraSelect    = $('qdr-obra');

  artistaSelect.addEventListener('change', () => {
    const artista = artistaSelect.value;
    obraSelect.innerHTML = '';
    if (!artista) {
      obraSelect.disabled = true;
      obraSelect.innerHTML = '<option value="">— Primero selecciona un artista —</option>';
      return;
    }
    const obras = CATALOG[artista] || [];
    obraSelect.disabled = false;
    obraSelect.innerHTML = '<option value="">Seleccionar obra (opcional)</option>';
    obras.forEach(o => {
      const opt = document.createElement('option');
      opt.value = o; opt.textContent = o;
      obraSelect.appendChild(opt);
    });
  });

  // ── Formulario de contacto ────────────────────────────────
  function openLeadForm() {
    const d = lastData;
    if (d.nombre) $('qdr-nombre').value = d.nombre;
    if (d.obra_artista) {
      // Intentar preseleccionar artista si coincide con alguno del catálogo
      const matchedArtist = Object.keys(CATALOG).find(a => d.obra_artista.includes(a.split(' ')[0]));
      if (matchedArtist) {
        artistaSelect.value = matchedArtist;
        artistaSelect.dispatchEvent(new Event('change'));
      }
    }
    $('qdr-header').style.display = 'none';
    messages.style.display = 'none';
    inputArea.style.display = 'none';
    leadBtn.style.display = 'none';
    formWrap.classList.add('open');
  }

  function closeLeadForm() {
    formWrap.classList.remove('open');
    $('qdr-header').style.display = 'flex';
    messages.style.display = 'flex';
    inputArea.style.display = 'flex';
  }

  leadBtn.addEventListener('click', () => {
    const WA = '51938498725';
    const obra    = lastData.obra_titulo  || '';
    const artista = lastData.obra_artista || '';
    const url     = lastData.obra_url     || '';

    let msg = 'Hola Quadro,\n\n';
    if (obra) {
      msg += `Me interesa la obra "${obra}"`;
      if (artista) msg += ` de ${artista}`;
      msg += '.';
      if (url) msg += `\n${url}`;
    } else if (artista) {
      msg += `Me interesa conocer obras de ${artista}.`;
    } else {
      msg += 'Me gustaría recibir más información sobre sus obras.';
    }
    msg += '\n\n¿Pueden ayudarme?';

    window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`, '_blank');
  });

  formBack.addEventListener('click', closeLeadForm);

  $('qdr-form-success-back').addEventListener('click', () => {
    formSuccess.classList.remove('show');
    $('qdr-form-body').style.display = 'flex';
    $('qdr-form-submit').style.display = 'block';
    closeLeadForm();
  });

  // ── Envío del formulario ──────────────────────────────────
  formSubmit.addEventListener('click', async () => {
    const nombre  = $('qdr-nombre').value.trim();
    const email   = $('qdr-email').value.trim();
    const artista = $('qdr-artista').value;
    if (!nombre || !email) {
      alert('Por favor completa al menos tu nombre y email.'); return;
    }
    if (!artista) {
      alert('Por favor selecciona un artista de interés.'); return;
    }
    const prefix  = $('qdr-phone-prefix').value;
    const tel     = $('qdr-telefono').value.trim();
    const telefono = tel ? prefix + ' ' + tel : '';
    const obra    = $('qdr-obra').value;
    const obra_artista = obra ? artista + ' — ' + obra : artista;

    const payload = {
      nombre,
      email,
      telefono,
      pais:         $('qdr-pais').value,
      obra_artista,
      presupuesto:  $('qdr-presupuesto').value,
      consulta:     $('qdr-consulta').value.trim(),
      hp:           $('qdr-hp').value
    };

    formSubmit.textContent = 'Enviando...';
    formSubmit.disabled = true;

    try {
      await fetch(QDR_LEADS, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      $('qdr-form-body').style.display = 'none';
      formSubmit.style.display = 'none';
      formSuccess.classList.add('show');
    } catch(e) {
      alert('Hubo un problema al enviar. Por favor intenta nuevamente.');
      formSubmit.textContent = 'Enviar consulta';
      formSubmit.disabled = false;
    }
  });

})();
